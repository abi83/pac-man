# Temporary probe for abi83/interns#321 follow-up: does workflow_run accept a wildcard? Remove after.
name: probe-wild
run-name: "wild | wr_name=${{ github.event.workflow_run.name }} wr_conclusion=${{ github.event.workflow_run.conclusion }} wr_branch=${{ github.event.workflow_run.head_branch }} wr_sha=${{ github.event.workflow_run.head_sha }} wr_prs=${{ toJSON(github.event.workflow_run.pull_requests.*.number) }}"

on:
  workflow_run:
    workflows: ['*']
    types: [completed]

permissions: {}

jobs:
  record:
    if: github.event.workflow_run.name != 'probe-wild'
    runs-on: ubuntu-latest
    steps:
      - run: echo "wildcard matched ${{ github.event.workflow_run.name }}"
