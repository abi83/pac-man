name: claude-p-probe

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/claude-p-probe.yml

permissions:
  contents: read
  issues: write
  id-token: write

env:
  ISSUE: "46"
  ALLOWED_COMMENT: "mcp__gh-issues__comment_issue"

jobs:
  mcp:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Checkout pipeline assets
        uses: actions/checkout@v5
        with:
          repository: abi83/interns
          ref: v0
          path: .interns

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up pipeline Python
        uses: ./.interns/.github/actions/setup-pipeline-python

      - name: Set up gh-issues MCP server
        uses: ./.interns/.github/actions/setup-gh-issues-mcp
        with:
          gh_token: ${{ secrets.GITHUB_TOKEN }}
          tools: comment_issue

      - name: Install Claude Code CLI
        id: install
        run: |
          start=$(date +%s)
          npm install -g @anthropic-ai/claude-code@2.1.299
          echo "seconds=$(( $(date +%s) - start ))" >> "$GITHUB_OUTPUT"

      - name: Run claude -p (estimator-like, MCP comment, debug)
        id: run
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CLAUDE_CODE_MAX_OUTPUT_TOKENS: "8000"
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p out
          body=$(gh issue view "$ISSUE" --json title,body --jq '"TITLE: \(.title)\n\(.body)"')
          prompt="REPO: ${{ github.repository }}
          ISSUE NUMBER: $ISSUE
          $body

          Read the repository (Read/Grep/Glob) to see what the Scope would touch, then post ONE short comment on the issue via the comment_issue tool: a Low/Mid/High size guess citing the files you read. Do nothing else."
          set +e
          claude -p "$prompt" \
            --model claude-haiku-5-5 \
            --max-turns 12 \
            --mcp-config /tmp/mcp-config-gh-issues.json \
            --tools "Read,Grep,Glob" \
            --allowedTools "Read,Grep,Glob,$ALLOWED_COMMENT" \
            --output-format stream-json --verbose \
            --debug-file out/debug.log \
            > out/execution.jsonl 2> out/stderr.log
          echo "exit=$?" | tee -a out/exit.txt

      - name: Parity check with interns parsers
        if: always()
        run: |
          python3 - <<'PY'
          import json, pathlib
          events = [json.loads(l) for l in pathlib.Path("out/execution.jsonl").read_text().splitlines() if l.strip()]
          pathlib.Path("out/execution.json").write_text(json.dumps(events))
          from interns import execution
          from interns.steps import extract_metrics
          print("result_field cost:", execution.result_field("out/execution.json", "total_cost_usd"))
          print("tool_calls:", extract_metrics._tool_calls(events))
          print("models:", extract_metrics._models(execution.result_entry("out/execution.json").get("modelUsage", {})))
          PY

      - name: Summarize
        if: always()
        run: |
          {
            echo "### claude -p probe"
            echo "- CLI install seconds: ${{ steps.install.outputs.seconds }}"
            echo "- execution.jsonl lines: $(wc -l < out/execution.jsonl)"
            echo "- debug.log lines: $(wc -l < out/debug.log)"
            echo "- $(cat out/exit.txt)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: claude-p-mcp
          path: out/
          if-no-files-found: error
          retention-days: 2

  failures:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install -g @anthropic-ai/claude-code@2.1.299
      - name: Failure scenarios
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          mkdir -p out
          run() {
            name=$1; prompt=$2; shift 2
            set +e
            printf '%s' "$prompt" | "$@" > "out/$name.jsonl" 2> "out/$name.stderr"
            code=$?
            set -e
            echo "== $name: exit=$code lines=$(wc -l < out/$name.jsonl) stderr_bytes=$(wc -c < out/$name.stderr)"
            tail -n 1 "out/$name.jsonl" | python3 -c "
          import sys, json
          for l in sys.stdin:
              try: e = json.loads(l)
              except Exception as x: print('  last line not JSON:', l[:120]); continue
              print('  last event:', e.get('type'), e.get('subtype'), 'is_error=', e.get('is_error'), 'turns=', e.get('num_turns'), 'denials=', len(e.get('permission_denials') or []), 'errors=', str(e.get('errors'))[:120])
          "
            python3 - "out/$name.jsonl" <<'PY'
          import sys, json
          for l in open(sys.argv[1]):
              try: e = json.loads(l)
              except ValueError: continue
              if e.get("type") == "system" and e.get("subtype") == "init":
                  print("  init permissionMode:", e.get("permissionMode"))
              if e.get("type") == "user":
                  for b in e.get("message", {}).get("content") or []:
                      if isinstance(b, dict) and b.get("type") == "tool_result":
                          print("  tool_result is_error=", b.get("is_error"), str(b.get("content"))[:140].replace("\n", " "))
          PY
            head -c 300 "out/$name.stderr" | sed 's/^/  stderr: /'
          }
          base="claude -p --model claude-haiku-5-5 --output-format stream-json --verbose"
          run max_turns "Use Glob to list the files, then Read three different files, then summarize them." $base --max-turns 1 --tools "Read,Glob" --allowedTools "Read,Glob"
          run denial_default_flag "Run the shell command ls using the Bash tool and report the output." $base --max-turns 4 --tools "Read,Bash" --allowedTools "Read"
          run denial_explicit_default "Run the shell command ls using the Bash tool and report the output." $base --max-turns 4 --permission-mode default --tools "Read,Bash" --allowedTools "Read"
          run killed "Write a very long, detailed 3000-word essay about the history of Pac-Man." timeout -s KILL 6 $base --max-turns 3
          CLAUDE_CODE_OAUTH_TOKEN=invalid run bad_token "Say hi." $base --max-turns 1
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: claude-p-failures
          path: out/
          retention-days: 2

  cli:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install -g @anthropic-ai/claude-code@2.1.299
      - name: Run CLI
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p out
          claude -p "$(cat <<'P'
          REPO: abi83/pac-man
          Read src/main.ts and src/pause.ts with the Read tool, then reply with one sentence stating whether pause is implemented. Do not use any other tool.
          P
          )" --model claude-haiku-5-5 --max-turns 6 --tools "Read,Grep,Glob" --allowedTools "Read,Grep,Glob"             --output-format stream-json --verbose > out/execution.jsonl
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: parity-cli
          path: out/
          retention-days: 2

  action:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Run action
        id: act
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          show_full_output: true
          allowed_bots: "github-actions[bot]"
          prompt: |
            REPO: abi83/pac-man
            Read src/main.ts and src/pause.ts with the Read tool, then reply with one sentence stating whether pause is implemented. Do not use any other tool.
          claude_args: |
            --model claude-haiku-5-5
            --max-turns 6
            --tools "Read,Grep,Glob"
            --allowedTools "Read,Grep,Glob"
      - run: mkdir -p out && cp "${{ steps.act.outputs.execution_file }}" out/execution.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: parity-action
          path: out/
          retention-days: 2
